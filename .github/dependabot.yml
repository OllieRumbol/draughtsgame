# Weekly version updates keep spec section 6.5, items 5 and 7 true after the release (plan section 3.5, decision 14).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates come as one pull request a week. Each major update has its own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only, so a newer TypeScript cannot install
      # (plan section 3.5, decisions 1 and 14). Change this range when typescript-eslint supports one.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # The types follow the Node.js version in .nvmrc. Update them by hand when .nvmrc moves to a newer LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
